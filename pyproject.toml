[project]
name = "murmur-desktop"
version = "0.4.7"
description = "Windows voice dictation assistant"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "sounddevice>=0.5",
    "dashscope==1.27.7",
    "httpx>=0.28",
    "keyring>=25",
    "pynput>=1.8",
    "pywin32>=310; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "numpy>=2.2",
    "websocket-client>=1.8",
    "gguf==0.19.0",
    "onnxruntime-directml==1.24.4",
    "sentencepiece==0.2.1",
]

[project.scripts]
murmur = "murmur.app:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["murmur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
